server:
  port: 8080
  servlet:
    context-path: /

# Metrics-mall configuration
metrics_mall:
  # Environment type: TEST, GRAY or PRODUCTION
  environment: TEST

spring:
  application:
    name: metrics-mall

# SpringDoc OpenAPI (Swagger) 配置
springdoc:
  api-docs:
    # API 文档的访问路径，默认为 /v3/api-docs
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 的访问路径，默认为 /swagger-ui.html
    path: /swagger-ui.html
    # 是否启用 Swagger UI，默认为 true
    enabled: true
    # 是否显示请求头，默认为 true
    show-request-headers: true
    # 是否显示响应头，默认为 true
    show-response-headers: true
    # 是否显示操作 ID，默认为 true
    show-common-extensions: true
    # 是否启用深度链接，默认为 false
    deep-linking: true
    # 是否启用过滤，默认为 false
    filter: true
    # 是否启用尝试操作，默认为 true
    try-it-out-enabled: true
  # 需要扫描的包路径（可选，如果不设置则扫描所有包）
  packages-to-scan: lab.zhang.data_science.metrics_mall
