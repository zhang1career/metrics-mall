server:
  port: 8080
  servlet:
    context-path: /

# Metrics-mall configuration
metrics_mall:
  # Environment type: TEST, GRAY or PROD
  environment: GRAY

spring:
  application:
    name: metrics-mall

  profiles:
    active: gray

  # Database connection pool configuration (HikariCP)
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/metrics_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_THRESHOLD:60000}

  # Redis configuration for gray environment
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1


# SpringDoc OpenAPI (Swagger) 配置
springdoc:
  api-docs:
    # API 文档的访问路径，默认为 /v3/api-docs
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 的访问路径，默认为 /swagger-ui.html
    path: /swagger-ui.html
    # 是否启用 Swagger UI，默认为 true
    enabled: true
    # 是否显示请求头，默认为 true
    show-request-headers: true
    # 是否显示响应头，默认为 true
    show-response-headers: true
    # 是否显示操作 ID，默认为 true
    show-common-extensions: true
    # 是否启用深度链接，默认为 false
    deep-linking: true
    # 是否启用过滤，默认为 false
    filter: true
    # 是否启用尝试操作，默认为 true
    try-it-out-enabled: true
  # 需要扫描的包路径（可选，如果不设置则扫描所有包）
  packages-to-scan: lab.zhang.data_science.metrics_mall

# MyBatis Plus configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
